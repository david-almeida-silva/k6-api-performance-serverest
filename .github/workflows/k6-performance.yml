name: K6 Performance & Load Testing - ServeRest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  k6-test:
    name: Run K6 Performance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v5

      - name: Executar Smoke Test (k6)
        uses: grafana/k6-action@v0
        with:
          filename: tests/smoke-test.js

      - name: Executar Load Test (k6)
        uses: grafana/k6-action@v0
        with:
          filename: tests/load-test.js